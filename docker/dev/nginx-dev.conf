# DeerFlow 开发 Nginx：文本压缩 + 仅版本化静态资源加浏览器缓存头
# 代理：/ → 前端(next dev :3000)，/api → 网关(:18001)
worker_processes auto;
events { worker_connections 1024; }
http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;
  sendfile on;

  # ── 文本压缩（文本类才压；图片/视频不压）──────────────────────────────
  gzip on;
  gzip_comp_level 5;
  gzip_min_length 1024;
  gzip_vary on;
  gzip_proxied any;
  gzip_types text/plain text/css text/javascript application/javascript
             application/json application/manifest+json
             image/svg+xml application/wasm;

  # ── 仅版本化静态资源：内容哈希路径 = 内容变更即换 URL，可长期强缓存 ──
  map $uri $static_cache {
    default                            "no-cache";
    ~^/_next/static/                   "public, max-age=31536000, immutable";   # Next 构建产物（内容哈希目录）
    ~\.(js|css)\?v=                    "public, max-age=31536000, immutable";   # ?v= 显式版本
    ~\.(js|css|woff2?|png|jpg|svg)$    "";  # 无版本号的同名资源：不加缓存头（交给默认协商）
  }

  server {
    listen 80;

    location /_next/static/ {
      proxy_pass http://host.docker.internal:3000;
      proxy_set_header Host $host;
      add_header Cache-Control "public, max-age=31536000, immutable";
    }
    # 带 ?v= 显式版本的静态资源
    location ~* \.(js|css|woff2?|png|jpg|jpeg|svg|webp)$ {
      proxy_pass http://host.docker.internal:3000;
      proxy_set_header Host $host;
      add_header Cache-Control $static_cache;
    }
    # API：不缓存
    location /api/ {
      proxy_pass http://host.docker.internal:18001;
      proxy_set_header Host $host;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;          # 会话 WebSocket
      proxy_set_header Connection "upgrade";
      add_header Cache-Control "no-store";
    }
    # 其余（HTML/页面/普通接口）：不缓存
    location / {
      proxy_pass http://host.docker.internal:3000;
      proxy_set_header Host $host;
      proxy_http_version 1.1;
      proxy_set_header Upgrade $http_upgrade;
      proxy_set_header Connection "upgrade";
    }
  }
}
